<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="aGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48bb78;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0e27" stroke="url(#aGradient)" stroke-width="2"/>

  <!-- Big sparkly A -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="60" font-weight="bold"
        fill="url(#aGradient)" text-anchor="middle" filter="url(#glow)">A</text>

  <!-- Sparkles around the A -->
  <circle cx="25" cy="25" r="3" fill="url(#sparkle)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <polygon points="75,20 77,25 82,25 78,28 80,33 75,30 70,33 72,28 68,25 73,25"
           fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="85" cy="60" r="2" fill="#4299e1">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <polygon points="20,75 21,78 24,78 22,80 23,83 20,81 17,83 18,80 16,78 19,78"
           fill="#667eea" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="80" cy="80" r="2.5" fill="#f093fb">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <polygon points="30,15 31,17 33,17 32,19 33,21 30,19 28,21 28,19 27,17 29,17"
           fill="#fbd38d" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.9s" repeatCount="indefinite"/>
  </polygon>
</svg>
