<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abishua Space - Your Personal Universe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h1>Entering Abishua Space...</h1>
        </div>
    </div>

    <canvas id="space-canvas"></canvas>

    <div id="ui-overlay">
        <header>
            <h1 class="title">
                <span class="title-text">ABISHUA SPACE</span>
                <span class="title-subtitle">Your Personal Universe</span>
            </h1>
        </header>

        <div class="instructions">
            <p>🌟 Click on any planet to explore</p>
        </div>
    </div>

    <!-- Planet Modal -->
    <div id="planet-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <div class="planet-icon"></div>
                <h2 id="modal-title"></h2>
            </div>
            <div class="modal-body">
                <p id="modal-description"></p>
                <div class="modal-features">
                    <h3>Features:</h3>
                    <ul id="modal-features-list"></ul>
                </div>
            </div>
            <div class="modal-footer">
                <a id="modal-link" href="#" target="_blank" class="enter-btn">
                    <span>Enter Planet</span>
                    <span class="btn-glow"></span>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
